version: "1.0.0"
hooks:
  pre-commit:
    - command: "assess"
      args: ["--categories", "format,lint,security", "--fail-on", "critical", "--package-mode"]
      priority: 10
      timeout: "90s"
  pre-push:
    # The checked-in .goneat/hooks/pre-push delegates to `make prepush`
    # (goneat assess plus the public-surface scan); keep this entry in step.
    - command: "make"
      args: ["prepush"]
      priority: 10
      timeout: "10m"
optimization:
  cache_results: true
  content_source: working
  only_changed_files: true
  parallel: auto
